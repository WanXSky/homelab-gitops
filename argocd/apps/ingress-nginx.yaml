apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targeRevision: "4.13.1"
      helm:
        valueFiles:
          - $values/infrastructure/ingress-nginx/values.yaml

    - repoURL: https://github.com/WanXSky/homelab-gitops.git 
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc 
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true 
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
