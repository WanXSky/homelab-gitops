apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: base-api
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: base-api=ghcr.io/wanxsky/base-api 
    argocd-image-updater.argoproj.io/base-api.update-strategy: newest-build 
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/base-api.pull-secret: pullsecret:argocd/argocd-image-updater-registry-creds
    argocd-image-updater.argoproj.io/base-api.ignore-tags: latest
    argocd-image-updater.argoproj.io/write-back-target: kustomization



spec:
  project: production
  source:
    repoURL: https://github.com/WanXSky/homelab-gitops.git 
    targetRevision: main
    path: applications/production/base-api 
  destination:
    server: https://kubernetes.default.svc
    namespace: production 
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
